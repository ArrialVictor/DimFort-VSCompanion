name: ci

# Per-push compile + lint check. Build.yml runs on tag push for the
# packaged .vsix; this one is the fast feedback loop so a TypeScript
# regression doesn't sit on main unnoticed until the next tag.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so the silent-failure gate's diff-aware check
          # can resolve the merge base against origin/main.
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: npm ci
      - name: Compile TypeScript
        # tsc emits to ./out; failures here mean the extension would
        # fail to load at runtime, so the compile step is the
        # primary signal.
        run: npm run compile
      - name: Silent-failure regression gate
        # Locks in the 0.2.7 silent-failure audit (companion side).
        # Hard-bans empty catch blocks. Requires `audited(0.2.X)`
        # annotation on new catch blocks in `src/**/*.ts`. See
        # docs/silent-failure-audit.md for the baseline.
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: |
          if [ -n "$BASE_REF" ]; then
            git fetch --quiet origin "${{ github.base_ref }}"
          fi
          python scripts/silent-failure-gate.py
