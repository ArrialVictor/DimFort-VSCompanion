<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- A ruler: instantly reads as "units / measurement". VSCode masks
       this SVG by its alpha channel and tints it with the active
       theme's activity-bar foreground, so the exact colour here is
       irrelevant — only the shape matters. -->
  <g fill="none" stroke="#000000" stroke-width="1.6"
     stroke-linejoin="round" stroke-linecap="round">
    <rect x="2.25" y="8" width="19.5" height="8" rx="1.2"/>
    <line x1="6.5" y1="8" x2="6.5" y2="12.5"/>
    <line x1="10.5" y1="8" x2="10.5" y2="11"/>
    <line x1="14.5" y1="8" x2="14.5" y2="12.5"/>
    <line x1="18.5" y1="8" x2="18.5" y2="11"/>
  </g>
</svg>
